<!DOCTYPE html>
<html lang="en">
  
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Mike Drop</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  
  <body>
    <header>
      <div class="masthead">
  <h1>Mike Drop</h1>
        <div class="masthead-actions">
          <button id="new-post" hidden>+ Post</button>
          <button id="login">Log in</button>
          <div id="account-menu" hidden>
            <button id="avatar-btn" class="avatar" aria-haspopup="true" aria-expanded="false">
              <img id="avatar-img" alt="" hidden>
              <span id="avatar-initial"></span>
            </button>
            <div id="account-dropdown" hidden>
              <button type="button" id="menu-settings">Account settings</button>
              <button type="button" id="menu-signout">Sign out</button>
            </div>
          </div>
        </div>
      </div>
      <nav class="tabs">
        <a href="#coding">Coding</a>
        <a href="#woodworking">Woodworking</a>
        <a href="#fitness">Fitness</a>
      </nav>
    </header>

    <main></main>

    <dialog id="auth-modal">
      <button class="modal-close" type="button" id="btn-modal-close">✕</button>
      <button class="btn-google" type="button" id="btn-google">Continue with Google</button>
      <div class="divider">or continue with email</div>
      <form id="email-form">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email">
        <label for="auth-password">Password</label>
        <div class="pw-row">
          <input type="password" id="auth-password" autocomplete="current-password">
          <button type="button" id="btn-show-pw">Show</button>
        </div>
        <label class="notify" id="notify-row" hidden>
          <input type="checkbox" id="auth-notify">
          Email me when there's a new post
        </label>
        <p id="auth-error" hidden></p>
        <button type="submit" id="btn-submit">Sign in</button>
        <button type="button" id="btn-forgot">Forgot your password?</button>
        <button type="button" id="btn-toggle-mode">Need an account? Sign up</button>
      </form>
    </dialog>
    
    <dialog id="settings-modal">
      <button class="modal-close" type="button" id="btn-settings-close">✕</button>
      <h2>Account settings</h2>
      <form id="settings-form">
        <label for="settings-name">Display name</label>
        <input type="text" id="settings-name" autocomplete="name">
        <label class="notify">
          <input type="checkbox" id="settings-notify">
          Email me when there's a new post
        </label>
        <p id="settings-message" hidden></p>
        <button type="submit">Save</button>
      </form>
    </dialog>
    
    <dialog id="post-modal">
      <button class="modal-close" type="button" id="btn-post-close">✕</button>
      <h2>New post</h2>
      <form id="post-form">
        <label for="post-title">Title</label>
        <input type="text" id="post-title" autocomplete="off">
    
        <label for="post-category">Category</label>
        <select id="post-category">
          <option value="coding">Coding</option>
          <option value="woodworking">Woodworking</option>
          <option value="fitness">Fitness</option>
        </select>
    
        <label for="post-body">Content (markdown)</label>
        <textarea id="post-body" rows="12"></textarea>
    
        <label for="post-tags">Tags (comma separated)</label>
        <input type="text" id="post-tags" autocomplete="off" placeholder="css, firebase">
    
        <p id="post-message" hidden></p>
        <button type="submit">Publish</button>
      </form>
    </dialog>
    
    <script type="module" src="js/main.js"></script>
  </body>
</html>
